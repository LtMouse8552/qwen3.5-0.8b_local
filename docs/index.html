<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen3.5 Chat — 本地大模型</title>
<style>
  :root {
    --bg: #0f1117; --panel: #1a1d27; --border: #2a2e3d;
    --text: #e4e6ef; --muted: #8b90a3;
    --user-bg: #2b3a67; --bot-bg: #232734;
    --accent: #5b8def;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    background: var(--panel);
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header .status { font-size: 12px; color: var(--muted); }
  header .status .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 5px; background: #888;
  }
  header .status.online .dot { background: #4ade80; }
  header .status.offline .dot { background: #f87171; }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px;
         line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user-bg); border-bottom-right-radius: 4px; }
  .msg.bot  { align-self: flex-start; background: var(--bot-bg); border-bottom-left-radius: 4px; }
  .msg.err  { align-self: center; color: #f87171; font-size: 13px; background: none; }
  .typing::after { content: "▌"; animation: blink 1s steps(1) infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }
  footer {
    display: flex; gap: 10px; padding: 14px 20px;
    border-top: 1px solid var(--border); background: var(--panel);
  }
  #input {
    flex: 1; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 14px; font-size: 14px; outline: none; resize: none;
    font-family: inherit;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--accent); color: #fff; border: none;
    border-radius: 10px; padding: 0 22px; font-size: 14px; cursor: pointer;
  }
  #send:disabled { opacity: .45; cursor: not-allowed; }
  .hint {
    text-align: center; color: var(--muted); font-size: 12px; padding: 8px;
  }
</style>
</head>
<body>
<header>
  <h1>🤖 Qwen3.5 Chat <span style="font-size:12px;color:var(--muted)">qwen3.5:0.8B · Ollama</span></h1>
  <div class="status" id="status"><span class="dot"></span>检测连接中…</div>
</header>

<div id="chat"></div>
<div class="hint">⚠️ 此页面调用本机 Ollama API，仅在本机（或运行该模型的电脑上）打开时可用</div>

<footer>
  <textarea id="input" rows="1" placeholder="请输入您的问题… (Enter 发送 / Shift+Enter 换行)"></textarea>
  <button id="send">发送</button>
</footer>

<script>
// 局域网/其他设备访问时改成运行 Ollama 的机器 IP，如 http://192.168.1.10:11434
// 依次尝试的候选地址（本机通常 localhost 即可，若浏览器拦截再回退 127.0.0.1）
const API_CANDIDATES = [
  location.hostname === "localhost" || location.hostname === "127.0.0.1"
    ? "http://localhost:11434"
    : `http://${location.hostname}:11434`,
  "http://127.0.0.1:11434",
];
let API = API_CANDIDATES[0];

const MODEL = "qwen3.5:0.8B";
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");
const history = [];

// ---------- 连接状态检测 ----------
async function probe(base) {
  const r = await fetch(`${base}/api/tags`, { signal: AbortSignal.timeout(3000) });
  return r.ok;
}

async function checkStatus() {
  for (const base of API_CANDIDATES) {
    try {
      if (await probe(base)) {
        API = base; // 记住可用的地址，聊天请求直接复用
        statusEl.className = "status online";
        statusEl.innerHTML = `<span class="dot"></span>已连接 Ollama（${base}）`;
        return;
      }
    } catch { /* 尝试下一个候选地址 */ }
  }
  statusEl.className = "status offline";
  statusEl.innerHTML = `<span class="dot"></span>Ollama 未运行或被浏览器拦截`;
}
checkStatus();
setInterval(checkStatus, 15000);

// ---------- 聊天逻辑 ----------
function addMsg(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  inputEl.style.height = "auto";
  sendBtn.disabled = true;

  addMsg("user", text);
  const botDiv = addMsg("bot", "");
  botDiv.classList.add("typing");

  history.push({ role: "user", content: text });

  try {
    const resp = await fetch(`${API}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: MODEL,
        messages: history,
        stream: true,
        think: false,
        options: { num_predict: 1024, temperature: 1.0 }
      }),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "", full = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const data = JSON.parse(line);
        if (data.done) break;
        const piece = data.message?.content || "";
        if (piece) {
          full += piece;
          botDiv.textContent = full;
          chatEl.scrollTop = chatEl.scrollHeight;
        }
      }
    }
    botDiv.classList.remove("typing");
    botDiv.textContent = full || "（模型未返回内容）";
    history.push({ role: "assistant", content: full });
  } catch (e) {
    botDiv.classList.remove("typing");
    botDiv.remove();
    history.pop();
    addMsg("err", `⚠️ 调用失败：${e.message}。请确认 Ollama 已启动，且设置了 OLLAMA_ORIGINS 允许跨域。`);
  }
  sendBtn.disabled = false;
  inputEl.focus();
}

sendBtn.onclick = send;
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
});
inputEl.focus();
</script>
</body>
</html>
