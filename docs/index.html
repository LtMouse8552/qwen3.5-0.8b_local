<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen3.5 Chat — 探索未至之境</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a1e;
    --muted: #8a8f9d;
    --border: #e8e9ee;
    --accent: #4d6bfe;
    --accent-soft: #eef1ff;
    --bot-bg: #f5f6fa;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ===== 顶栏 ===== */
  header {
    height: 56px; flex: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px;
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; }
  .brand .logo {
    width: 26px; height: 26px; border-radius: 8px;
    background: linear-gradient(135deg, #4d6bfe, #7a5cff);
    display: grid; place-items: center; color: #fff; font-size: 14px;
  }
  .status { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: #c3c7d1; }
  .status.online .dot { background: #22c55e; }
  .status.offline .dot { background: #ef4444; }

  /* ===== 首页态（hero）===== */
  #home {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 34px; padding: 20px; transition: opacity .3s;
  }
  #home.hidden, #chatwrap.hidden { display: none; }
  .hero-title {
    font-size: clamp(30px, 5vw, 46px);
    font-weight: 700; letter-spacing: .5px; text-align: center;
    background: linear-gradient(100deg, #1a1a1e 30%, #4d6bfe);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero-sub { color: var(--muted); font-size: 14px; margin-top: -22px; text-align: center; }

  /* ===== 输入区（首页/聊天共用样式）===== */
  .composer { width: min(680px, 92vw); }
  .input-box {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bot-bg);
    padding: 12px 14px 10px;
    transition: border-color .2s, box-shadow .2s;
  }
  .input-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  #input {
    width: 100%; border: none; outline: none; resize: none;
    background: transparent; color: var(--text);
    font-size: 15px; line-height: 1.55; font-family: inherit;
    max-height: 180px;
  }
  .input-actions {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 8px;
  }
  .toggles { display: flex; gap: 8px; }
  .toggle {
    display: flex; align-items: center; gap: 5px;
    font-size: 12.5px; color: var(--muted);
    border: 1px solid var(--border); border-radius: 20px;
    padding: 5px 12px; cursor: pointer; user-select: none;
    background: transparent; transition: all .15s;
  }
  .toggle:hover { border-color: var(--accent); color: var(--accent); }
  .toggle.on {
    background: var(--accent-soft); border-color: var(--accent); color: var(--accent);
  }
  #send {
    width: 34px; height: 34px; border-radius: 10px; border: none;
    background: var(--accent); color: #fff; font-size: 15px;
    cursor: pointer; display: grid; place-items: center;
    transition: opacity .15s;
  }
  #send:disabled { opacity: .35; cursor: not-allowed; }

  /* ===== 聊天态 ===== */
  #chatwrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #chat {
    flex: 1; overflow-y: auto; padding: 26px 20px 10px;
  }
  #chat .inner { width: min(680px, 92vw); margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  .msg { line-height: 1.7; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .msg.user {
    align-self: flex-end;
    background: var(--bot-bg); border-radius: 14px 14px 4px 14px;
    padding: 10px 15px; max-width: 82%;
  }
  .msg.bot { align-self: stretch; }
  .msg.bot .who {
    font-size: 12.5px; color: var(--muted); margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .msg.bot .who .logo { width: 18px; height: 18px; font-size: 10px; border-radius: 6px; }
  .msg.err { align-self: center; color: #ef4444; font-size: 13px; }
  .typing::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }

  /* 聊天态底部输入 */
  #dock {
    flex: none; padding: 8px 20px 18px;
  }
  #dock .composer { margin: 0 auto; }
  .hint {
    text-align: center; color: var(--muted); font-size: 11.5px; padding-bottom: 10px;
  }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: #dfe1e8; border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="brand"><div class="logo">Q</div>Qwen3.5 Chat</div>
  <div class="status" id="status"><span class="dot"></span>检测连接中…</div>
</header>

<!-- 首页态 -->
<div id="home">
  <h1 class="hero-title">探索未至之境</h1>
  <p class="hero-sub">本地部署的 Qwen3.5:0.8B · 数据不出本机 · 由 Ollama 驱动</p>
  <div class="composer">
    <div class="input-box">
      <textarea id="input" rows="1" placeholder="给 Qwen3.5 发送消息…"></textarea>
      <div class="input-actions">
        <div class="toggles">
          <div class="toggle" id="tgThink">💡 深度思考</div>
          <div class="toggle" id="tgMemory">🧠 长期记忆</div>
        </div>
        <button id="send" title="发送">↑</button>
      </div>
    </div>
  </div>
</div>

<!-- 聊天态 -->
<div id="chatwrap" class="hidden">
  <div id="chat"><div class="inner" id="chatInner"></div></div>
  <div id="dock">
    <div class="hint">内容由本地模型生成，请注意甄别准确性 · Enter 发送 / Shift+Enter 换行</div>
    <div class="composer">
      <div class="input-box">
        <textarea id="input2" rows="1" placeholder="给 Qwen3.5 发送消息…"></textarea>
        <div class="input-actions">
          <div class="toggles">
            <div class="toggle" id="tgThink2">💡 深度思考</div>
            <div class="toggle" id="tgMemory2">🧠 长期记忆</div>
          </div>
          <button id="send2" title="发送">↑</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API_CANDIDATES = [
  location.hostname === "localhost" || location.hostname === "127.0.0.1"
    ? "http://localhost:11434"
    : `http://${location.hostname}:11434`,
  "http://127.0.0.1:11434",
];
let API = API_CANDIDATES[0];
const MODEL = "qwen3.5:0.8B";

const homeEl = document.getElementById("home");
const chatWrap = document.getElementById("chatwrap");
const chatEl = document.getElementById("chat");
const chatInner = document.getElementById("chatInner");
const statusEl = document.getElementById("status");
const history = [];

// 两个输入区共用一套状态
const inputs = [
  { ta: document.getElementById("input"),  btn: document.getElementById("send"),  think: document.getElementById("tgThink"),  mem: document.getElementById("tgMemory") },
  { ta: document.getElementById("input2"), btn: document.getElementById("send2"), think: document.getElementById("tgThink2"), mem: document.getElementById("tgMemory2") },
];
const state = { thinking: false, memory: false, busy: false };

// ---------- 连接状态 ----------
async function probe(base) {
  const r = await fetch(`${base}/api/tags`, { signal: AbortSignal.timeout(3000) });
  return r.ok;
}
async function checkStatus() {
  for (const base of API_CANDIDATES) {
    try {
      if (await probe(base)) {
        API = base;
        statusEl.className = "status online";
        statusEl.innerHTML = `<span class="dot"></span>已连接`;
        return;
      }
    } catch {}
  }
  statusEl.className = "status offline";
  statusEl.innerHTML = `<span class="dot"></span>Ollama 未运行或被浏览器拦截`;
}
checkStatus();
setInterval(checkStatus, 15000);

// ---------- 切换到聊天态 ----------
function enterChat() {
  if (!chatWrap.classList.contains("hidden")) return;
  homeEl.classList.add("hidden");
  chatWrap.classList.remove("hidden");
  inputs[1].ta.focus();
}

// ---------- 开关 ----------
function bindToggle(el, key) {
  el.onclick = () => {
    state[key] = !state[key];
    el.classList.toggle("on", state[key]);
    inputs.forEach(i => i[key === "thinking" ? "think" : "mem"].classList.toggle("on", state[key]));
  };
}
bindToggle(inputs[0].think, "thinking");
bindToggle(inputs[1].think, "thinking");
bindToggle(inputs[0].mem, "memory");
bindToggle(inputs[1].mem, "memory");

// ---------- 消息渲染 ----------
function addMsg(cls, html) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  if (html !== undefined) div.innerHTML = html;
  chatInner.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}
function botShell() {
  return addMsg("bot", `<div class="who"><div class="logo">Q</div>Qwen3.5</div><div class="body"></div>`);
}

// ---------- 发送 ----------
async function send(text) {
  if (state.busy) return;
  text = (text ?? inputs.find(i => i.ta.value.trim())?.ta?.value ?? "").trim();
  if (!text) return;

  // 用当前焦点所在输入框，清空两个
  inputs.forEach(i => { i.ta.value = ""; i.ta.style.height = "auto"; });
  state.busy = true;
  inputs.forEach(i => i.btn.disabled = true);

  enterChat();
  addMsg("user", esc(text));
  const shell = botShell();
  const body = shell.querySelector(".body");
  shell.classList.add("typing");

  // 构建消息：记忆 + 思考开关
  const msgs = state.memory ? [...history] : [];
  msgs.push({ role: "user", content: text });

  try {
    const resp = await fetch(`${API}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: MODEL, messages: msgs, stream: true,
        think: state.thinking,
        options: { num_predict: 2048, temperature: 1.0 },
      }),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "", full = "", thinkingText = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const d = JSON.parse(line);
        if (d.done) break;
        const m = d.message || {};
        if (m.thinking) {
          thinkingText += m.thinking;
          body.innerHTML = `<details open style="color:var(--muted);font-size:13px;margin-bottom:8px"><summary style="cursor:pointer">💭 思考过程</summary>${esc(thinkingText)}</details>` + esc(full);
        } else if (m.content) {
          full += m.content;
          body.innerHTML = (thinkingText ? `<details style="color:var(--muted);font-size:13px;margin-bottom:8px"><summary style="cursor:pointer">💭 思考过程（已完成）</summary>${esc(thinkingText)}</details>` : "") + esc(full);
        }
        chatEl.scrollTop = chatEl.scrollHeight;
      }
    }
    shell.classList.remove("typing");
    body.innerHTML = (thinkingText ? `<details style="color:var(--muted);font-size:13px;margin-bottom:8px"><summary style="cursor:pointer">💭 思考过程（已完成）</summary>${esc(thinkingText)}</details>` : "") + (esc(full) || "（模型未返回内容）");
    history.push({ role: "user", content: text });
    history.push({ role: "assistant", content: full });
  } catch (e) {
    shell.classList.remove("typing");
    shell.remove();
    addMsg("err", `⚠️ 调用失败：${e.message} · 请确认 Ollama 已启动且已设置 OLLAMA_ORIGINS=*`);
  }
  state.busy = false;
  inputs.forEach(i => i.btn.disabled = false);
  inputs[1].ta.focus();
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ---------- 输入绑定 ----------
inputs.forEach((inp, idx) => {
  inp.btn.onclick = () => send();
  inp.ta.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inp.ta.addEventListener("input", () => {
    inp.ta.style.height = "auto";
    inp.ta.style.height = Math.min(inp.ta.scrollHeight, 180) + "px";
  });
});
</script>
</body>
</html>
