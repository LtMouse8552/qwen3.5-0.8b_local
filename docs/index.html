<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalRAG Chat — 本地知识库 · 私有 AI 问答</title>
<style>
  :root {
    --bg: #0B0F14;
    --side: #0F141A;
    --panel: #111820;
    --card: #161F2A;
    --line: #24303D;
    --txt: #E6EDF3;
    --sub: #8B98A5;
    --accent: #22D3EE;
    --accent2: #7C3AED;
    --ok: #22C55E;
    --warn: #F59E0B;
    --err: #EF4444;

    /* 液态玻璃变量 */
    --glass-bg-1: rgba(17, 24, 32, 0.55);
    --glass-bg-2: rgba(22, 31, 42, 0.45);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-highlight: rgba(255, 255, 255, 0.10);
    --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    --glass-blur: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(900px 420px at 50% -120px, rgba(34,211,238,0.10), transparent 60%),
      var(--bg);
    color: var(--txt);
    font-family: Inter, "HarmonyOS Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; overflow: hidden;
  }
  code, .mono { font-family: "JetBrains Mono", Consolas, monospace; font-size: 13px; }

  /* ===== 玻璃类（仅容器/悬浮层，正文不用） ===== */
  .glass-toolbar {
    background: rgba(15, 20, 26, 0.72);
    backdrop-filter: blur(24px) saturate(150%);
    -webkit-backdrop-filter: blur(24px) saturate(150%);
    border-bottom: 1px solid var(--glass-border);
  }
  .glass-panel {
    background:
      linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)),
      var(--glass-bg-1);
    backdrop-filter: blur(var(--glass-blur)) saturate(140%);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(140%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
    border-radius: 18px;
  }
  .glass-input {
    background: rgba(22, 31, 42, 0.55);
    backdrop-filter: blur(14px) saturate(130%);
    -webkit-backdrop-filter: blur(14px) saturate(130%);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
  }
  .glass-source {
    background:
      linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012)),
      rgba(22, 31, 42, 0.50);
    backdrop-filter: blur(16px) saturate(135%);
    -webkit-backdrop-filter: blur(16px) saturate(135%);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
  }
  .glass-source.active {
    border-color: rgba(34, 211, 238, 0.45);
    box-shadow: 0 0 0 1px rgba(34,211,238,0.20), 0 8px 32px rgba(34,211,238,0.10),
      inset 0 1px 0 rgba(255,255,255,0.12);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass-toolbar { background: #0F141A; }
    .glass-panel   { background: #111820; }
    .glass-input   { background: #161F2A; }
    .glass-source  { background: #161F2A; }
    .glass-toolbar, .glass-panel, .glass-input, .glass-source {
      backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
    }
  }

  /* ===== 顶栏 ===== */
  header {
    height: 56px; flex: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; }
  .brand .logo {
    width: 26px; height: 26px; border-radius: 8px;
    background: linear-gradient(135deg, #22D3EE, #7C3AED);
    display: grid; place-items: center; color: #06121a; font-size: 13px; font-weight: 700;
  }
  .status { font-size: 12.5px; color: var(--sub); display: flex; align-items: center; gap: 6px; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: #c3c7d1; }
  .status.online .dot { background: var(--ok); box-shadow: 0 0 0 0 rgba(34,211,238,0.25); animation: glow 2s infinite; }
  .status.offline .dot { background: var(--err); }
  @keyframes glow {
    0%,100% { box-shadow: 0 0 0 0 rgba(34,211,238,0.25); }
    50% { box-shadow: 0 0 0 6px rgba(34,211,238,0); }
  }

  /* ===== 首页态（hero）===== */
  #home {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 30px; padding: 20px;
  }
  #home.hidden, #chatwrap.hidden { display: none; }
  .hero-title {
    font-size: clamp(30px, 5vw, 46px); font-weight: 600;
    letter-spacing: .5px; text-align: center;
    background: linear-gradient(100deg, #E6EDF3 30%, #22D3EE);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero-sub { color: var(--sub); font-size: 14px; margin-top: -20px; text-align: center; }

  /* ===== 输入区（共用）===== */
  .composer { width: min(680px, 92vw); }
  .input-box { padding: 12px 14px 10px; transition: border-color .2s, box-shadow .2s; }
  .input-box:focus-within {
    border-color: rgba(34,211,238,0.5);
    box-shadow: 0 0 0 3px rgba(34,211,238,0.08);
  }
  #input, #input2 {
    width: 100%; border: none; outline: none; resize: none;
    background: transparent; color: var(--txt);
    font-size: 15px; line-height: 1.55; font-family: inherit; max-height: 180px;
  }
  #input::placeholder, #input2::placeholder { color: rgba(139,152,165,0.5); }
  .input-actions { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .toggles { display: flex; gap: 8px; }
  .toggle {
    display: flex; align-items: center; gap: 5px;
    font-size: 12.5px; color: var(--sub);
    border: 1px solid var(--glass-border); border-radius: 20px;
    padding: 5px 12px; cursor: pointer; user-select: none; background: transparent;
    transition: all .15s;
  }
  .toggle:hover { border-color: rgba(34,211,238,0.5); color: var(--accent); }
  .toggle.on { background: rgba(34,211,238,0.10); border-color: rgba(34,211,238,0.5); color: var(--accent); }
  .send-btn {
    width: 34px; height: 34px; border-radius: 10px; border: none;
    background: var(--accent); color: #06121a; font-size: 15px;
    cursor: pointer; display: grid; place-items: center; transition: opacity .15s;
  }
  .send-btn:disabled { opacity: .35; cursor: not-allowed; }
  .send-btn.stop { background: var(--err); color: #fff; }

  /* ===== 聊天态 ===== */
  #chatwrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #chat { flex: 1; overflow-y: auto; padding: 24px 20px 10px; }
  #chat .inner { width: min(860px, 94vw); margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  .msg { line-height: 1.7; font-size: 15px; }
  .msg.user {
    align-self: flex-end;
    background: #1E293B; border-radius: 14px 14px 4px 14px;
    padding: 10px 15px; max-width: 70%;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.bot { align-self: stretch; max-width: 860px; }
  .msg.err { align-self: center; color: var(--err); font-size: 13px; }
  .who {
    font-size: 12.5px; color: var(--sub); margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .who .logo { width: 18px; height: 18px; font-size: 10px; border-radius: 6px; }
  /* Markdown 正文：实色，无玻璃 */
  .md-body pre {
    background: #0D1117; border: 1px solid var(--line);
    border-radius: 12px; padding: 13px 15px; overflow-x: auto; margin: .6em 0;
  }
  .md-body code {
    background: #0D1117; border: 1px solid var(--line);
    border-radius: 6px; padding: 1px 6px;
  }
  .md-body pre code { background: none; border: none; padding: 0; }
  .md-body ul { padding-left: 1.4em; margin: .4em 0; list-style: disc; }
  .md-body ol { padding-left: 1.4em; margin: .4em 0; list-style: decimal; }
  .md-body strong { color: #fff; }
  .cite-badge {
    display: inline-flex; align-items: center;
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--accent); border: 1px solid rgba(34,211,238,0.45);
    border-radius: 6px; padding: 0 5px; margin: 0 2px;
    cursor: pointer; vertical-align: 1px; transition: background .15s;
  }
  .cite-badge:hover { background: rgba(34,211,238,0.12); }
  .typing::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }
  .think-details {
    color: var(--sub); font-size: 13px; margin-bottom: 8px;
    border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px;
  }
  .think-details summary { cursor: pointer; }

  /* ===== 引用面板（右栏）===== */
  #sources {
    width: 320px; flex: none;
    border-left: 1px solid var(--line);
    background: rgba(15,20,26,0.60);
    display: flex; flex-direction: column; min-height: 0;
    transition: width .2s, padding .2s;
  }
  #sources.collapsed { width: 0; padding: 0; border: none; overflow: hidden; }
  #sources h3 {
    font-size: 13.5px; font-weight: 500;
    padding: 12px 16px; border-bottom: 1px solid var(--line); flex: none;
  }
  #srcList { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .src-card { padding: 12px; cursor: pointer; transition: border-color .2s; }
  .src-card:hover { border-color: rgba(255,255,255,0.15); }
  .src-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .src-badge {
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    padding: 1px 6px; border-radius: 6px;
    border: 1px solid rgba(34,211,238,0.45); color: var(--accent);
  }
  .src-name { font-size: 13px; font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src-meta { font-size: 11.5px; color: var(--sub); margin-bottom: 8px; }
  .sim-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .sim-track { flex: 1; height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .sim-fill { height: 100%; border-radius: 99px; background: var(--accent); }
  .sim-pct { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--accent); }
  .src-snip {
    font-size: 12.5px; color: var(--sub); line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;
  }
  .src-snip mark { background: rgba(34,211,238,0.18); color: var(--accent); border-radius: 3px; padding: 0 2px; }

  #dock { flex: none; padding: 10px 20px 16px; }
  #dock .composer { margin: 0 auto; }
  .hint { text-align: center; color: var(--sub); font-size: 11.5px; padding-bottom: 8px; }
  .thinking-hint {
    text-align: center; color: var(--accent); font-size: 12px; padding: 6px;
    border-bottom: 1px solid var(--line); flex: none;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #24303d; border-radius: 4px; }

  /* ===== 响应式：移动端降 blur ===== */
  @media (max-width: 900px) {
    #sources { position: fixed; right: 0; top: 56px; bottom: 0; z-index: 40;
      width: min(340px, 88vw); background: rgba(15,20,26,0.92);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  }
  @media (max-width: 767px) {
    :root { --glass-blur: 12px; }
  }
</style>
</head>
<body>

<header class="glass-toolbar">
  <div class="brand"><div class="logo">L</div>LocalRAG Chat</div>
  <div class="status" id="status"><span class="dot"></span>检测连接中…</div>
</header>

<div class="thinking-hint" id="thinkHint" style="display:none">正在检索知识库…</div>

<!-- 首页态 -->
<div id="home">
  <h1 class="hero-title">本地知识库 · 私有 AI 问答</h1>
  <p class="hero-sub">由本机 Ollama 驱动 · 数据不出设备 · <span class="mono" style="color:var(--accent)">qwen3.5:0.8B</span></p>
  <div class="composer">
    <div class="input-box glass-panel">
      <textarea id="input" rows="1" placeholder="基于知识库提问…"></textarea>
      <div class="input-actions">
        <div class="toggles">
          <div class="toggle" id="tgThink">💡 深度思考</div>
          <div class="toggle on" id="tgCite">📚 引用来源</div>
        </div>
        <button class="send-btn" id="send" title="发送">↑</button>
      </div>
    </div>
  </div>
</div>

<!-- 聊天态 -->
<div id="chatwrap" class="hidden">
  <div id="chat"><div class="inner" id="chatInner"></div></div>
  <div id="dock">
    <div class="hint">内容由本地模型生成，请注意甄别 · Enter 发送 / Shift+Enter 换行</div>
    <div class="composer">
      <div class="input-box glass-panel">
        <textarea id="input2" rows="1" placeholder="基于知识库提问…"></textarea>
        <div class="input-actions">
          <div class="toggles">
            <div class="toggle" id="tgThink2">💡 深度思考</div>
            <div class="toggle on" id="tgCite2">📚 引用来源</div>
          </div>
          <button class="send-btn" id="send2" title="发送">↑</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 引用来源右栏 -->
<aside id="sources">
  <h3>引用来源</h3>
  <div id="srcList">
    <div style="text-align:center;color:var(--sub);font-size:12.5px;padding:40px 10px">本次回答未使用知识库</div>
  </div>
</aside>

<script>
// ---------- 配置与候选地址 ----------
const API_CANDIDATES = [
  location.hostname === "localhost" || location.hostname === "127.0.0.1"
    ? "http://localhost:11434"
    : `http://${location.hostname}:11434`,
  "http://127.0.0.1:11434",
];
let API = API_CANDIDATES[0];
const MODEL = "qwen3.5:0.8B";

const homeEl = document.getElementById("home");
const chatWrap = document.getElementById("chatwrap");
const chatEl = document.getElementById("chat");
const chatInner = document.getElementById("chatInner");
const statusEl = document.getElementById("status");
const srcList = document.getElementById("srcList");
const sourcesEl = document.getElementById("sources");
const thinkHint = document.getElementById("thinkHint");
const history = [];
let lastCitations = [];

const inputs = [
  { ta: document.getElementById("input"),  btn: document.getElementById("send"),  think: document.getElementById("tgThink"),  cite: document.getElementById("tgCite") },
  { ta: document.getElementById("input2"), btn: document.getElementById("send2"), think: document.getElementById("tgThink2"), cite: document.getElementById("tgCite2") },
];
const state = { thinking: false, cite: true, busy: false };

// ---------- 连接状态检测 ----------
async function probe(base) {
  const r = await fetch(`${base}/api/tags`, { signal: AbortSignal.timeout(3000) });
  return r.ok;
}
async function checkStatus() {
  for (const base of API_CANDIDATES) {
    try {
      if (await probe(base)) {
        API = base;
        statusEl.className = "status online";
        statusEl.innerHTML = `<span class="dot"></span>已连接`;
        return;
      }
    } catch {}
  }
  statusEl.className = "status offline";
  statusEl.innerHTML = `<span class="dot"></span>Ollama 未运行或被浏览器拦截`;
}
checkStatus();
setInterval(checkStatus, 15000);

// ---------- 状态切换 ----------
function enterChat() {
  if (!chatWrap.classList.contains("hidden")) return;
  homeEl.classList.add("hidden");
  chatWrap.classList.remove("hidden");
  inputs[1].ta.focus();
}

function bindToggle(el, key) {
  el.onclick = () => {
    state[key] = !state[key];
    el.classList.toggle("on", state[key]);
    inputs.forEach(i => i[key === "thinking" ? "think" : "cite"].classList.toggle("on", state[key]));
    if (key === "cite") sourcesEl.classList.toggle("collapsed", !state.cite);
  };
}
bindToggle(inputs[0].think, "thinking");
bindToggle(inputs[1].think, "thinking");
bindToggle(inputs[0].cite, "cite");
bindToggle(inputs[1].cite, "cite");

// ---------- 工具 ----------
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function renderMd(src) {
  let s = esc(src);
  s = s.replace(/```(\w*)\n([\s\S]*?)```/g, (_m, lang, code) => `<pre><code>${code}</code></pre>`);
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  s = s.replace(/^### (.+)$/gm, "<h3>$1</h3>").replace(/^## (.+)$/gm, "<h2>$1</h2>").replace(/^# (.+)$/gm, "<h1>$1</h1>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/((?:^[-*] .+\n?)+)/gm, (m) => {
    const items = m.trim().split("\n").map((l) => `<li>${l.replace(/^[-*] /, "")}</li>`).join("");
    return `<ul>${items}</ul>`;
  });
  s = s.replace(/((?:^\d+\. .+\n?)+)/gm, (m) => {
    const items = m.trim().split("\n").map((l) => `<li>${l.replace(/^\d+\. /, "")}</li>`).join("");
    return `<ol>${items}</ol>`;
  });
  s = s.replace(/\[(\d)\]/g, '<span class="cite-badge" data-cite="$1">[$1]</span>');
  s = s.replace(/\n(?!<)/g, "<br/>");
  return s;
}
function addMsg(cls, html) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  if (html !== undefined) div.innerHTML = html;
  chatInner.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

// ---------- 引用面板渲染 ----------
function renderSources(cites) {
  lastCitations = cites || [];
  if (!lastCitations.length) {
    srcList.innerHTML = `<div style="text-align:center;color:var(--sub);font-size:12.5px;padding:40px 10px">本次回答未使用知识库</div>`;
    return;
  }
  srcList.innerHTML = lastCitations.map((c) => `
    <div class="src-card glass-source" id="source-card-${c.id}">
      <div class="src-head">
        <span class="src-badge">[${c.id}]</span>
        <span class="src-name">${esc(c.docName)}</span>
      </div>
      <div class="src-meta">第 ${c.page} 页 · ${esc(c.section)}</div>
      <div class="sim-bar">
        <div class="sim-track"><div class="sim-fill" style="width:${c.similarity}%"></div></div>
        <span class="sim-pct">${c.similarity}%</span>
      </div>
      <p class="src-snip">${esc(c.snippet).replace(esc(c.keyword), `<mark>${esc(c.keyword)}</mark>`)}</p>
    </div>
  `).join("");
}
function jumpToCite(n) {
  if (!state.cite) return;
  document.querySelectorAll(".src-card").forEach((el) => el.classList.remove("active"));
  const el = document.getElementById(`source-card-${n}`);
  if (el) { el.classList.add("active"); el.scrollIntoView({ behavior: "smooth", block: "center" }); }
}

// ---------- 发送 ----------
async function send(text) {
  if (state.busy) return;
  text = (text ?? inputs.find((i) => i.ta.value.trim())?.ta?.value ?? "").trim();
  if (!text) return;
  inputs.forEach((i) => { i.ta.value = ""; i.ta.style.height = "auto"; });
  state.busy = true;
  inputs.forEach((i) => { i.btn.disabled = true; i.btn.classList.add("stop"); i.btn.innerHTML = "■"; });

  enterChat();
  addMsg("user", esc(text));
  const shell = addMsg("bot", `<div class="who"><div class="logo">L</div>LocalRAG</div><div class="md-body body typing"></div>`);
  const body = shell.querySelector(".body");
  thinkHint.style.display = "block";
  renderSources([]);

  const msgs = [...history, { role: "user", content: text }];

  try {
    const resp = await fetch(`${API}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: MODEL, messages: msgs, stream: true,
        think: state.thinking,
        options: { num_predict: 2048, temperature: 0.7 },
      }),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "", full = "", thinkingText = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const d = JSON.parse(line);
        if (d.done) break;
        const m = d.message || {};
        if (m.thinking) {
          thinkingText += m.thinking;
          body.innerHTML = `<details class="think-details" open><summary>💭 思考过程</summary>${renderMd(thinkingText)}</details>` + renderMd(full);
        } else if (m.content) {
          full += m.content;
          body.innerHTML = (thinkingText ? `<details class="think-details"><summary>💭 思考过程（已完成）</summary>${renderMd(thinkingText)}</details>` : "") + renderMd(full);
        }
        chatEl.scrollTop = chatEl.scrollHeight;
      }
    }
    // 完成：固化最终消息（示例引用演示，实际 RAG 由后端返回）
    body.classList.remove("typing");
    body.innerHTML = (thinkingText ? `<details class="think-details"><summary>💭 思考过程（已完成）</summary>${renderMd(thinkingText)}</details>` : "")
      + (renderMd(full) || "（模型未返回内容）");
    history.push({ role: "user", content: text });
    history.push({ role: "assistant", content: full });
  } catch (e) {
    shell.remove();
    addMsg("err", `⚠️ 调用失败：${e.message} · 请确认 Ollama 已启动且设置了 OLLAMA_ORIGINS=*`);
  }
  thinkHint.style.display = "none";
  state.busy = false;
  inputs.forEach((i) => { i.btn.disabled = false; i.btn.classList.remove("stop"); i.btn.innerHTML = "↑"; });
  inputs[1].ta.focus();
}

// ---------- 事件绑定 ----------
inputs.forEach((inp) => {
  inp.btn.onclick = () => send();
  inp.ta.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inp.ta.addEventListener("input", () => {
    inp.ta.style.height = "auto";
    inp.ta.style.height = Math.min(inp.ta.scrollHeight, 180) + "px";
  });
});
chatInner.addEventListener("click", (e) => {
  const t = e.target.closest(".cite-badge");
  if (t) jumpToCite(Number(t.dataset.cite));
});
</script>
</body>
</html>
